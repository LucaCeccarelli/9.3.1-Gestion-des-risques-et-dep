[project]
name = "meteo"
version = "0.1.0"
description = "TP1/TP2 - API meteo : adresse postale -> previsions (Nominatim ou BAN, Open-Meteo ou MET Norway)"
requires-python = ">=3.12"
dependencies = [
    "dependency-injector>=4.41",
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["e2e: tests against the running container (opt-in: pytest -m e2e)"]
addopts = "-m 'not e2e'"
