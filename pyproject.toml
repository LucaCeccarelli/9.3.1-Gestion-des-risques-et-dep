[project]
name = "meteo"
version = "0.1.0"
description = "TP1 - API meteo : adresse postale -> previsions (Nominatim + Open-Meteo)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["e2e: Playwright tests against a running server (opt-in: pytest -m e2e)"]
addopts = "-m 'not e2e'"
base_url = "http://localhost:8000"
